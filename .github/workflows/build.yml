# TT Central — Windows build (skeleton)
#
# Phase 0 CI scaffolding. Configures the project on a Windows runner. Build and
# test steps are enabled as module targets land (see docs/ROADMAP.md).
# The public CI uses the SDK in trial mode; a licensed SDK is never committed.

name: build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # Qt returns at milestone 1.1 (the client shell); the SDK smoke test
      # (milestone 1.0) needs only the SDK + MSVC.

      - name: Fetch TeamTalk SDK (proprietary; trial mode, not committed)
        run: |
          python -m pip install py7zr
          python scripts/fetch_sdk.py

      - name: Configure (CMake)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build SDK smoke test
        run: cmake --build build --config Release --target ttc-sdkcheck

      - name: Run SDK smoke test
        run: ./build/src/sdkcheck/Release/ttc-sdkcheck.exe
