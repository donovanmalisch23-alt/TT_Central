# TT Central — Windows build
#
# Builds and smoke-tests TT Central on a Windows runner:
#   1.0  ttc-sdkcheck   — links the TeamTalk SDK and prints its version
#   1.1  TT Central client — BearWare's qtTeamTalk (pinned submodule) + our
#        patches, with Prism screen-reader support; launch-tested.
#
# The proprietary TeamTalk SDK is fetched at build time in trial mode and is
# never committed. No build artifacts are uploaded, because redistributing
# binaries that contain the SDK requires a BearWare license key.

name: build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Patches must apply byte-exact; keep the repository's LF line endings.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout (with pinned upstream submodule)
        uses: actions/checkout@v5
        with:
          submodules: true

      # Same Qt as BearWare's own Windows CI for TeamTalk v5.23.
      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia qtspeech'
          cache: true
          aqtsource: 'aqtinstall@git+https://github.com/miurahr/aqtinstall.git@master'

      - name: Bootstrap (fetch SDK, stage it, apply patches)
        run: |
          python -m pip install py7zr
          python scripts/bootstrap.py

      - name: Configure (CMake)
        # Let CMake auto-detect whichever Visual Studio is installed.
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run SDK smoke test
        run: ./build/src/sdkcheck/Release/ttc-sdkcheck.exe

      - name: Client launch smoke test
        shell: pwsh
        run: ./scripts/ci/smoke-launch.ps1
