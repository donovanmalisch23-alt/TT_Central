# TT Central — Windows build
#
# Builds and smoke-tests TT Central on a Windows runner:
#   1.0  ttc-sdkcheck   — links the TeamTalk SDK and prints its version
#   1.1  TT Central client — BearWare's qtTeamTalk (pinned submodule) + our
#        patches, with Prism screen-reader support; launch-tested.
#   1.2  ttc-mediabot — the media player bot (native port of Simple TT Media)
#   tests: unit tests, integration tests against a real tt5srv (monitors and
#          the media bot), and an in-app self-test (incl. accessibility
#          audit) of TTCentral.exe.
#
# The proprietary TeamTalk SDK is fetched at build time in trial mode and is
# never committed. No build artifacts are uploaded, because redistributing
# binaries that contain the SDK requires a BearWare license key.

name: build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # Patches must apply byte-exact; keep the repository's LF line endings.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout (with pinned upstream submodule)
        uses: actions/checkout@v5
        with:
          submodules: true

      # Same Qt as BearWare's own Windows CI for TeamTalk v5.23.
      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia qtspeech'
          cache: true
          aqtsource: 'aqtinstall@git+https://github.com/miurahr/aqtinstall.git@master'

      - name: Bootstrap (fetch SDK, stage it, apply patches)
        run: |
          python -m pip install py7zr
          python scripts/bootstrap.py

      # ffmpeg, yt-dlp and Deno for the media bot (downloaded, never committed).
      - name: Cache media tools
        uses: actions/cache@v4
        with:
          path: tools/.cache
          key: media-tools-win64-v1

      - name: Fetch media tools
        run: python scripts/fetch_tools.py

      - name: Configure (CMake)
        # Let CMake auto-detect whichever Visual Studio is installed.
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      # Also activates the SDK's trial, pressing OK on its one-time notice
      # (nobody is there to press it on a CI runner).
      # The second run shows the activation persists for every later process
      # (the client's self-test creates its SDK instance before TT Central
      # can answer anything).
      - name: Run SDK smoke test
        timeout-minutes: 5
        run: |
          ./build/src/sdkcheck/Release/ttc-sdkcheck.exe --activate-trial
          ./build/src/sdkcheck/Release/ttc-sdkcheck.exe --activate-trial

      # Unit tests plus integration tests against BearWare's real TeamTalk
      # server (tt5srv, fetched with the SDK), bound to 127.0.0.1.
      - name: Run tests
        timeout-minutes: 25
        run: ctest --test-dir build -C Release --output-on-failure --timeout 300

      - name: Show test logs (on failure)
        if: failure()
        shell: pwsh
        run: |
          # Stop anything a timed-out test left running, then read each log
          # even if something still holds it open.
          foreach ($n in 'tt5srv', 'pcmgen', 'ttc-mediabot', 'ffmpeg') { Stop-Process -Name $n -Force -ErrorAction SilentlyContinue }
          Get-ChildItem build/test-logs -Filter *.txt -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.Name)"
            try {
              $fs = [System.IO.File]::Open($_.FullName, 'Open', 'Read', 'ReadWrite')
              $reader = New-Object System.IO.StreamReader($fs)
              Write-Host $reader.ReadToEnd()
              $reader.Close()
            } catch { Write-Host "  (could not read: $_)" }
          }

      # Inside the real client: menu placement, shortcut clashes, every window
      # opens, and an accessibility audit of all TT Central controls.
      - name: Client self-test (in the real TTCentral.exe)
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/ci/selftest.ps1

      # Portable zip + installer, each tested with a clean PATH. Not uploaded:
      # the packages contain the proprietary TeamTalk SDK.
      - name: Package and test the packages
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/ci/package-test.ps1
